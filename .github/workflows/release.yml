name: Publicar versión

# Se ejecuta al subir una etiqueta que empiece por «v» (por ejemplo v1.2.0): compila, prueba y crea la release con el
# instalador .msi, el .zip portable y SHA256SUMS.txt (las sumas que MedMDR comprueba antes de actualizarse solo).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # build.ps1 instala WiX 6 en .tools\ la primera vez (dotnet tool), así que no hace falta nada más.
      - name: Pruebas, instalador MSI y paquete
        shell: pwsh
        run: ./build.ps1 -Test -Zip -Installer

      - name: Comprobar que la versión coincide con la etiqueta
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $msi = Get-ChildItem dist -Filter 'MedMDR-*-x64.msi' | Select-Object -First 1
          if (-not $msi) { throw 'No se encontró el instalador .msi' }
          if ($msi.Name -ne "MedMDR-$tag-x64.msi") { throw "La etiqueta v$tag no coincide con la versión compilada ($($msi.Name)). Sube <Version> en los .csproj antes de etiquetar." }

      - name: Crear (o actualizar) la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(
            (Get-ChildItem dist -Filter 'MedMDR-*-x64.msi' | Select-Object -First 1),
            (Get-ChildItem dist -Filter 'Medrar-*-x64.msi' | Select-Object -First 1),   # copia con el nombre antiguo: así se actualizan las copias instaladas de «Medrar»
            (Get-ChildItem dist -Filter 'MedMDR-*-win-x64.zip' | Select-Object -First 1),
            (Get-Item dist\SHA256SUMS.txt)
          ) | ForEach-Object { $_.FullName }
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber   # la release ya existe: solo se suben los ficheros
          } else {
            gh release create $tag @files --title "MedMDR $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la release' }
