name: Publicar versión

# Se ejecuta al subir una etiqueta que empiece por «v» (por ejemplo v1.1.0): compila, prueba y crea la release con el .zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Inno Setup (para crear el instalador)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Pruebas, instalador y paquete
        shell: pwsh
        run: ./build.ps1 -Test -Zip -Installer

      - name: Crear (o actualizar) la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem dist -Filter 'Medrar-*-win-x64.zip' | Select-Object -First 1
          $setup = Get-ChildItem dist -Filter 'Medrar-Setup-*.exe' | Select-Object -First 1
          if (-not $zip) { throw 'No se encontró el paquete .zip' }
          if (-not $setup) { throw 'No se encontró el instalador' }
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName $zip.FullName --clobber   # la release ya existe: solo se suben los ficheros
          } else {
            gh release create $tag $setup.FullName $zip.FullName --title "Medrar $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la release' }
