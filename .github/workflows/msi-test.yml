name: Probar el instalador MSI

# Construye el .msi, lo instala en silencio en un Windows limpio (como administrador, igual que haría el usuario tras el aviso de
# permisos), comprueba ficheros, acceso del menú Inicio, asociaciones y menú del botón derecho, y lo desinstala comprobando que
# no queda nada.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'build.ps1', '.github/workflows/msi-test.yml']

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Construir el instalador
        shell: pwsh
        run: ./build.ps1 -Installer

      - name: Instalar, comprobar y desinstalar
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist -Filter 'MedMDR-*-x64.msi' | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", 'ADDLOCAL=ALL', '/qn', '/l*v', "`"$env:RUNNER_TEMP\inst.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\inst.log" -Tail 60; throw "msiexec salió con $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\MedMDR"
          $fallos = @()
          foreach ($f in 'MedMDR.exe', 'mdr.exe', 'MedMDR.Sfx.exe', 'MedMDR.Sfx.Full.exe') { if (-not (Test-Path "$dir\$f")) { $fallos += "falta $f" } }
          foreach ($k in 'Software\MedMDR', 'Software\Classes\.mdr', 'Software\Classes\MedMDR.Archive\shell\open\command',
                         'Software\Classes\Directory\shell\MedMDR.Add\command', 'Software\Classes\Directory\Background\shell\MedMDR.Open\command',
                         'Software\Classes\Applications\MedMDR.exe\shell\open\command') {
            if (-not (Test-Path -LiteralPath "HKLM:\$k")) { $fallos += "falta la clave HKLM\$k" }
          }
          if (-not (Test-Path -LiteralPath 'HKLM:\Software\Classes\*\shell\MedMDR.Add\command')) { $fallos += 'falta la clave del menú de ficheros' }
          if ((Get-ItemProperty HKLM:\Software\MedMDR).Installer -ne 'msi') { $fallos += 'falta la marca Installer=msi' }
          # El acceso del menú Inicio debe apuntar al .exe (si no, Windows no ofrece «Desinstalar»)
          $lnk = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\MedMDR.lnk"
          if (-not (Test-Path $lnk)) { $fallos += 'falta el acceso del menú Inicio' }
          else { $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath; if ($t -ne "$dir\MedMDR.exe") { $fallos += "el acceso apunta a '$t'" } }
          # Aparece en «Aplicaciones instaladas» (lo que habilita «Desinstalar»)
          $arp = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object DisplayName -eq 'MedMDR'
          if (-not $arp) { $fallos += 'no aparece en Aplicaciones instaladas' } else { "Aplicaciones instaladas: $($arp.DisplayName) $($arp.DisplayVersion)" }
          & "$dir\mdr.exe" -h | Select-Object -First 1
          if ($fallos) { $fallos; throw 'La instalación no dejó todo lo esperado.' }
          Write-Host 'Instalación correcta'

          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "la desinstalación salió con $($p.ExitCode)" }
          $restos = @()
          if (Test-Path $dir) { $restos += $dir }
          if (Test-Path $lnk) { $restos += $lnk }
          foreach ($k in 'Software\MedMDR', 'Software\Classes\.mdr', 'Software\Classes\MedMDR.Archive', 'Software\Classes\Directory\shell\MedMDR.Add', 'Software\Classes\Applications\MedMDR.exe') {
            if (Test-Path -LiteralPath "HKLM:\$k") { $restos += "HKLM\$k" }
          }
          if ($restos) { $restos; throw 'La desinstalación dejó restos.' }
          Write-Host 'Desinstalación limpia'
